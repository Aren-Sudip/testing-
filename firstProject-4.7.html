<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudip's Page</title>
    <link rel="stylesheet" href="firstProject-4.7.css" />
  </head>
  <body>
    <div class="container">
      <div class="imagePart">
        <img
          class="templateImg"
          src="images/bg.jpg"
          alt="projectTemplateImage"
        />
      </div>

      <div class="detailsPart">
        <h2 class="mainHeader">Get iintoo it today</h2>

        <p class="mainPara">
          There is no charge or obligation upon registration.
        </p>

        <div class="buttons">
          <button class="facebookBtn">
            <img class="fbSvg" src="images/facebook.svg" alt="facebook logo" />
            <span class="fbText"> Register with Facebook</span>
          </button>

          <button class="linkedinBtn">
            <img
              class="lnSvg"
              src="images/linkedin.svg"
              alt="linkedin logo"
            /><span class="lnText">Register with Linkedin</span>
          </button>
        </div>
        <button class="orBtn">OR</button>
        <!-- <p class="orText"></p> -->
        <br />

        <div class="inputContainers">
          <input type="email" class="email" name="email" placeholder="Email" />
          <input type="tel" class="phone" name="phone" placeholder="Phone" />
        </div>

        <h2 class="secondHeader">What type of investor are you?</h2>
        <p class="secondPara">Select the type of investor you are below.</p>

        <input type="radio" name="radio" />
        <label for="individual"
          >Individual <img class="infoImg" src="images/info.png" />
        </label>
        <input type="radio" name="radio" />
        <label for="business" name="radio"
          >Business <img class="infoImg" src="images/info.png" />
        </label>
        <input type="radio" name="radio" />
        <label for="ira"
          >IRA <img class="infoImg" src="images/info.png" />
        </label>
        <input type="radio" name="radio" />
        <label for="trust"
          >Trust <img class="infoImg" src="images/info.png" />
        </label>

        <br />
        <textarea class="selfIntro" name="introduction" rows="4" cols="33">
I am a natural person investing on my own behalf as a sole owner,joint tenant, or tenant in common.
</textarea
        >
        <div class="checkboxContainer">
          <input type="checkbox" class="confirmationBox" required />
          <label class="confirmationText" for="confirm"
            >i agree to the terms and receiving notifications from iintoo
            <a href="https://www.iintoo.com/" target="_blank"
              >view full terms</a
            ></label
          >
        </div>

        <br />
        <button class="createAccount">Create Account</button>
      </div>
    </div>
  </body>
</html>
